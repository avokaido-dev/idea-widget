name: avokaido_idea_widget
description: >-
  Embeddable suggestion widget for Dart and Flutter web apps. One call opens a
  hosted interview that turns "this is wrong, look" into a feature request your
  team can act on.
version: 1.1.0
repository: https://github.com/avokaido-dev/idea-widget
issue_tracker: https://github.com/avokaido-dev/idea-widget/issues

environment:
  sdk: ^3.4.0

dependencies:
  web: ^1.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Web only, and stated so pub.dev says so on the listing rather than letting
# somebody discover it from a build failure. The stub implementation keeps a
# cross-platform app COMPILING when this is in its dependency list — it throws
# at the call, not at build time — but there is nothing here for a mobile or
# desktop target: the widget is an iframe around a hosted web page.
platforms:
  web:
